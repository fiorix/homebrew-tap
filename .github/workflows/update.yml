name: Update packages

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [release]

permissions:
  contents: write

jobs:
  minitile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Follow the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo fiorix/minitile --json tagName --jq .tagName)
          version=${tag#v}
          sha=$(gh release download "$tag" --repo fiorix/minitile --pattern minitile.dmg.sha256 --output - | awk '{print $1}')
          [[ "$sha" =~ ^[0-9a-f]{64}$ ]] || { echo "No checksum for $tag"; exit 1; }
          sed -i -E "s/^  version \".*\"/  version \"$version\"/; s/^  sha256 \".*\"/  sha256 \"$sha\"/" Casks/minitile.rb
          if git diff --quiet; then echo "minitile is already at $version"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Update minitile to $version"
          git pull --rebase
          git push
